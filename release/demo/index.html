<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saudi receptionist demo</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2328; --muted: #6b7076; --line: #e3ded3;
    --me: #d9fdd3; --them: #ffffff; --tool: #eef3fb; --tool-ink: #1d4f91; --ok: #1a7f37; --accent: #0e7c86;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1416; --panel: #161d20; --ink: #e8ecec; --muted: #93a0a4; --line: #263236;
            --me: #1f4d3a; --them: #1d272a; --tool: #172636; --tool-ink: #8cc2ff; --ok: #3fb950; --accent: #2bb3c0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1fr) 320px; min-height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { order: -1; } }
  header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; direction: ltr; }
  .chat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column;
          min-height: 70vh; overflow: hidden; }
  .log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .me { align-self: flex-start; background: var(--me); border-start-start-radius: 4px; }
  .them { align-self: flex-end; background: var(--them); border: 1px solid var(--line); border-start-end-radius: 4px; }
  .tool { align-self: center; width: min(92%, 560px); background: var(--tool); color: var(--tool-ink); border-radius: 10px;
          padding: 6px 10px; font: 13px/1.5 ui-monospace, Consolas, monospace; direction: ltr; text-align: left; }
  .tool b { font-weight: 600; }
  .tool .res { color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; font: inherit; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: wait; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; font-size: 14px; }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  aside ul { padding-inline-start: 18px; margin: 6px 0 14px; }
  .muted { color: var(--muted); }
  .typing { align-self: flex-end; color: var(--muted); font-size: 13px; }
  .reset { background: transparent; color: var(--muted); border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">…</h1>
    <div class="sub" id="sub">running locally</div>
  </header>
  <section class="chat">
    <div class="log" id="log"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="اكتب رسالتك… مثال: السلام عليكم ابي احجز تنظيف بكره العصر">
      <button id="send">إرسال</button>
      <button type="button" class="reset" id="reset">محادثة جديدة</button>
    </form>
  </section>
  <aside>
    <h2>العيادة (بيانات تجريبية)</h2>
    <div id="hours" class="muted"></div>
    <ul id="services"></ul>
    <h2>ما يحدث خلف الكواليس</h2>
    <p class="muted">كل استدعاء أداة يظهر في المحادثة بالأزرق: البحث في الخدمات، المواعيد المتاحة، الحجز، الإلغاء، أو التحويل لموظف. النموذج يعمل على جهازك، ولا يُرسل شيء إلى الإنترنت.</p>
  </aside>
</div>
<script>
const log = document.getElementById("log"), form = document.getElementById("form"), input = document.getElementById("msg");
const send = document.getElementById("send");
let session = Math.random().toString(36).slice(2);

function add(cls, html) { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function args(a) { return Object.entries(a || {}).map(([k, v]) => `${k}: ${esc(typeof v === "string" ? v : JSON.stringify(v))}`).join(", "); }
function summary(name, r) {
  if (r.error) return "error: " + esc(r.error);
  if (r.services) return r.services.map(s => `${esc(s.name)} · ${s.price_sar} SAR · ${s.duration_min} min`).join(" | ") || "no match";
  if (r.slots) return r.slots.length ? `${esc(r.date)}: ${r.slots.join(", ")}` : `${esc(r.date)}: ${r.note || "no free times"}`;
  if (r.bookings) return r.bookings.length ? r.bookings.map(b => `${esc(b.booking_id)} ${esc(b.service)} ${b.date} ${b.time}`).join(" | ") : "no bookings";
  if (r.status) return `${esc(r.status)}${r.booking_id ? " · " + esc(r.booking_id) : ""}${r.expected_wait_min ? " · team replies in ~" + r.expected_wait_min + " min" : ""}`;
  return esc(JSON.stringify(r));
}

fetch("/api/info").then(r => r.json()).then(i => {
  document.getElementById("title").textContent = `${i.business} · ${i.assistant}`;
  document.getElementById("sub").textContent = `${i.model} · running locally on one GPU`;
  document.getElementById("hours").textContent = "Hours: " + i.hours;
  document.getElementById("services").innerHTML = i.services.map(s => `<li>${esc(s.name)} — ${s.price} ريال</li>`).join("");
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  input.value = ""; send.disabled = true;
  add("bubble me", esc(text));
  const typing = add("typing", "يكتب…");
  try {
    const events = await (await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                                                   body: JSON.stringify({session, message: text})})).json();
    typing.remove();
    for (const ev of events) {
      if (ev.type === "tool_call") add("tool", `→ <b>${esc(ev.name)}</b>(${args(ev.arguments)})`);
      else if (ev.type === "tool_result") add("tool", `<span class="res">← ${summary(ev.name, ev.result)}</span>`);
      else add("bubble them", esc(ev.text));
    }
  } catch (err) { typing.textContent = "error: " + err; }
  send.disabled = false; input.focus();
});

document.getElementById("reset").addEventListener("click", async () => {
  session = Math.random().toString(36).slice(2); log.innerHTML = "";
  await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session, reset: true})});
  input.focus();
});
input.focus();
</script>
</body>
</html>
